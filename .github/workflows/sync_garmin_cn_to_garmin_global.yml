name: Sync Garmin CN to Garmin Global

on:
  workflow_dispatch:
    inputs:
      sync_command:
        description: "同步命令：普通 sync 只同步活动；sync_all 同步活动+Wellness；sync_wellness 只同步 Wellness"
        required: true
        default: "sync_cn"
        type: choice
        options:
          - sync_cn
          - sync_all_cn_to_global
          - sync_wellness_cn_to_global
          - sync_global
          - sync_all_global_to_cn
          - sync_wellness_global_to_cn
  schedule:
    #  每6小时检查一次
    - cron: "0 */6 * * *"
  push:
    branches:
      - main

env:
  # please change to your own config.
  RQ_COOKIE: ${{ secrets.RQ_COOKIE }}
  RQ_CSRF_TOKEN: ${{ secrets.RQ_CSRF_TOKEN }}
  RQ_USERID: ${{ secrets.RQ_USERID }}
  GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
  GOOGLE_API_CLIENT_EMAIL: ${{ secrets.GOOGLE_API_CLIENT_EMAIL }}
  GOOGLE_API_PRIVATE_KEY: ${{ secrets.GOOGLE_API_PRIVATE_KEY }}
  BARK_KEY: ${{ secrets.BARK_KEY }}
  GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
  GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
  GARMIN_GLOBAL_USERNAME: ${{ secrets.GARMIN_GLOBAL_USERNAME }}
  GARMIN_GLOBAL_PASSWORD: ${{ secrets.GARMIN_GLOBAL_PASSWORD }}
  # 复用本地登录得到的 OAuth 会话，Actions 里不再调用佳明登录接口（避免 429）
  GARMIN_CN_OAUTH1: ${{ secrets.GARMIN_CN_OAUTH1 }}
  GARMIN_CN_OAUTH2: ${{ secrets.GARMIN_CN_OAUTH2 }}
  GARMIN_GLOBAL_OAUTH1: ${{ secrets.GARMIN_GLOBAL_OAUTH1 }}
  GARMIN_GLOBAL_OAUTH2: ${{ secrets.GARMIN_GLOBAL_OAUTH2 }}
  # Wellness 健康数据默认关闭；需要同步步数、睡眠、HRV、压力等数据时，在 Secrets 中设置 GARMIN_SYNC_WELLNESS=true
  GARMIN_SYNC_WELLNESS: ${{ secrets.GARMIN_SYNC_WELLNESS }}
  # 日常同步时检查最近几天的健康数据；未配置时默认为 1
  GARMIN_WELLNESS_SYNC_DAYS: ${{ secrets.GARMIN_WELLNESS_SYNC_DAYS }}

jobs:
  build:
    runs-on: ubuntu-latest
    name: Sync Garmin CN to Garmin Global
    steps:
      - uses: actions/checkout@v3
      - name: Restore state (Garmin session + sync cursor)
        uses: actions/checkout@v4
        with:
          repository: hey-yohaku/dailysync-state
          ssh-key: ${{ secrets.STATE_DEPLOY_KEY }}
          path: state
      - name: Load state db
        run: |
          mkdir -p db
          if [ -f state/db/garmin.db ]; then
            cp state/db/garmin.db db/garmin.db
            echo "state db loaded"
          else
            echo "no state db found; falling back to password login (may hit 429)"
          fi
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'yarn'
      - run: yarn
      - name: Sync
        run: |
          CMD="${{ github.event.inputs.sync_command || 'sync_cn' }}"
          if [ "$CMD" = "sync_cn" ]; then
            yarn ts-node src/sync_and_persist.ts
          else
            yarn "$CMD"
          fi
        timeout-minutes: 15
      - name: Save state (always, so a rotated refresh token is never lost)
        if: always()
        run: |
          if [ ! -f db/garmin.db ]; then
            echo "no db to save"
            exit 0
          fi
          mkdir -p state/db
          cp db/garmin.db state/db/garmin.db
          cd state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "state unchanged"
          else
            git commit -m "state: $(date -u +%FT%TZ)"
            git push
          fi
